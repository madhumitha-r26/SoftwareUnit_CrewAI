openapi: 3.0.0
info:
  title: Task Management API
  description: Secure RESTful API for managing user tasks.
  version: 1.0.0
servers:
  - url: https://api.taskapp.com/v1
    description: Production server
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Task:
      type: object
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        title: { type: string }
        description: { type: string }
        due_date: { type: string, format: date-time }
        category: { type: string }
        is_completed: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
security:
  - bearerAuth: []
paths:
  /tasks:
    get:
      summary: List tasks
      parameters:
        - name: category
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string, enum: [completed, pending] }
      responses:
        '200':
          description: A list of tasks
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Task' }
    post:
      summary: Create task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, due_date]
              properties:
                title: { type: string }
                description: { type: string }
                due_date: { type: string, format: date-time }
                category: { type: string }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Task' }
        '400':
          description: Validation error
  /tasks/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      summary: Update task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string }
                description: { type: string }
                due_date: { type: string, format: date-time }
                category: { type: string }
                is_completed: { type: boolean }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Task' }
        '403':
          description: Forbidden/Not Found
    delete:
      summary: Remove task
      responses:
        '204':
          description: No Content
        '403':
          description: Forbidden/Not Found
