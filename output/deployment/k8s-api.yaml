apiVersion: apps/v1
kind: Deployment
metadata:
  name: stms-api
  labels:
    app: stms-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: stms-api
  template:
    metadata:
      labels:
        app: stms-api
    spec:
      containers:
      - name: stms-api
        image: ${IMAGE_TAG}_api
        ports:
        - containerPort: 3000
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: db-secrets
              key: url
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: auth-secrets
              key: secret
        resources:
          limits:
            cpu: "500m"
            memory: "512Mi"
          requests:
            cpu: "250m"
            memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: stms-api-service
spec:
  selector:
    app: stms-api
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000
  type: LoadBalancer
