version: '3.8'

services:
  # MongoDB Service
  mongo:
    image: mongo:6.0
    container_name: tms-mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Node.js Backend Service
  backend:
    build: ./backend
    container_name: tms-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - MONGO_URI=mongodb://mongo:27017/tms_db
      - JWT_SECRET=enterprise_secret_key_2024_tms
      - PORT=5000
      - NODE_ENV=production
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - tms-network

  # React Frontend Service
  frontend:
    build: ./frontend
    container_name: tms-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - tms-network

networks:
  tms-network:
    driver: bridge

volumes:
  mongo-data:
    driver: local
