name: CI-CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [backend, frontend]

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: './${{ matrix.component }}/package-lock.json'

      - name: Install Dependencies
        run: |
          cd ${{ matrix.component }}
          npm install

      - name: Run Tests
        run: |
          cd ${{ matrix.component }}
          npm test

      - name: Build Docker Image
        run: |
          docker build -t taskapp/${{ matrix.component }}:${{ github.sha }} -f deployment/${{ matrix.component }}.Dockerfile ./${{ matrix.component }}

      - name: Push to Registry
        if: github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
          docker push taskapp/${{ matrix.component }}:${{ github.sha }}
          docker tag taskapp/${{ matrix.component }}:${{ github.sha }} taskapp/${{ matrix.component }}:latest
          docker push taskapp/${{ matrix.component }}:latest

  deploy:
    needs: test-and-build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set Kubernetes Context
        uses: azure/k8s-set-context@v1
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBECONFIG }}

      - name: Deploy Backend
        run: |
          kubectl apply -f deployment/backend-k8s.yaml
          kubectl set image deployment/task-api task-api=taskapp/backend:${{ github.sha }}

      - name: Deploy Frontend
        run: |
          kubectl apply -f deployment/frontend-k8s.yaml
          kubectl set image deployment/task-ui task-ui=taskapp/frontend:${{ github.sha }}
