# Kubernetes Deployment for Frontend
apiVersion: apps/v1
kind: Deployment
metadata:
  name: task-ui
  labels:
    app: task-ui
spec:
  replicas: 2
  selector:
    matchLabels:
      app: task-ui
  template:
    metadata:
      labels:
        app: task-ui
    spec:
      containers:
      - name: task-ui
        image: task-ui:latest
        ports:
        - containerPort: 80
        resources:
          limits:
            cpu: "200m"
            memory: "256Mi"
          requests:
            cpu: "100m"
            memory: "128Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: task-ui-service
spec:
  type: LoadBalancer
  selector:
    app: task-ui
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
